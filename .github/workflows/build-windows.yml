name: build-windows

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  windows-amd64:
    name: windows/amd64
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        # All Bash invocations route through MSYS2 so MinGW tools and
        # pkg-config are on PATH, and the cgo CC/CXX picks them up too.
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          # The msys2 shell needs LF line endings to source bash scripts
          # without surprises.
          submodules: false

      - name: Set up MSYS2 + mingw64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          # Inherit the Windows PATH so the Go installed by setup-go is
          # visible inside the msys2 shell.
          path-type: inherit
          install: >-
            git
            base-devel
            pkgconf
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-libtorrent-rasterbar

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: server/go.sum

      - name: Probe toolchain
        run: |
          set -euo pipefail
          which gcc g++ pkg-config
          gcc --version | head -1
          g++ --version | head -1
          pkg-config --modversion libtorrent-rasterbar
          pkg-config --cflags libtorrent-rasterbar
          pkg-config --libs libtorrent-rasterbar
          go version

      - name: Run unit tests
        env:
          CGO_ENABLED: '1'
          CC: gcc
          CXX: g++
        run: |
          cd server
          # -v so a crash points at the offending test by name.
          go test -v -count=1 -timeout 180s ./lt/ ./torr/ ./torr/storage/torrstor/ ./dlna/

      - name: Build TorrServer-LT.exe
        env:
          CGO_ENABLED: '1'
          CC: gcc
          CXX: g++
        run: |
          set -euo pipefail
          cd server
          mkdir -p /d/a/out
          go build \
            -tags 'osusergo netgo' \
            -ldflags "-s -w -X server/version.Version=MatriX.LT-001" \
            -o /d/a/out/TorrServer-LT-windows-amd64.exe \
            ./cmd
          file /d/a/out/TorrServer-LT-windows-amd64.exe
          du -h /d/a/out/TorrServer-LT-windows-amd64.exe

      - name: Probe --version
        # Use the msys2 shell so the mingw64 PATH carries the runtime
        # DLLs (libtorrent-rasterbar, libstdc++, libwinpthread, etc.)
        # the exe was dynamically linked against.
        run: /d/a/out/TorrServer-LT-windows-amd64.exe --version

      - uses: actions/upload-artifact@v4
        with:
          name: TorrServer-LT-windows-amd64
          path: D:/a/out/TorrServer-LT-windows-amd64.exe
          if-no-files-found: error
