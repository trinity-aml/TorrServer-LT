name: build-macos

# macOS is built natively on Apple-Silicon runners (macos-latest):
#  - arm64 builds straight against the runner's Homebrew;
#  - amd64 cross-builds against an x86_64 Homebrew under Rosetta, so the
#    artifact is a real Intel binary (a plain build on macos-latest would be
#    arm64). This avoids the deprecated/flaky macos-13 Intel runner.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  # Reused by ts_release.yml on a tag; `version` stamps the binaries.
  workflow_call:
    inputs:
      version:
        type: string
        default: ''

jobs:
  macos:
    name: macos/${{ matrix.arch }}
    runs-on: macos-latest          # Apple Silicon (arm64)
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            goarch: arm64
            artifact: TorrServer-LT-darwin-arm64
          - arch: amd64
            goarch: amd64
            artifact: TorrServer-LT-darwin-amd64
    steps:
      - uses: actions/checkout@v4

      # arm64: native Homebrew at /opt/homebrew.
      - name: Install deps (native arm64)
        if: matrix.arch == 'arm64'
        run: |
          set -euo pipefail
          brew update >/dev/null
          brew install pkg-config libtorrent-rasterbar
          echo "BREW=brew" >> "$GITHUB_ENV"
          echo "ARCHFLAG="  >> "$GITHUB_ENV"

      # amd64: x86_64 Homebrew at /usr/local under Rosetta, then Intel bottles.
      - name: Install deps (x86_64 via Rosetta)
        if: matrix.arch == 'amd64'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_ENV_HINTS: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          set -euo pipefail
          # macos-latest already ships an x86_64 Homebrew at /usr/local and
          # Rosetta 2; set them up only if missing.
          /usr/bin/pgrep -q oahd || sudo softwareupdate --install-rosetta --agree-to-license || true
          if [ ! -x /usr/local/bin/brew ]; then
            arch -x86_64 /bin/bash -c \
              "NONINTERACTIVE=1 $(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi
          # Only libtorrent (pulls boost/openssl). pkg-config stays the arm64 one
          # already on PATH — it reads the x86_64 .pc fine. brew can exit non-zero
          # on a harmless PATH-shadow hint, so assert the .pc rather than trust $?.
          arch -x86_64 /usr/local/bin/brew install libtorrent-rasterbar || true
          LT=$(arch -x86_64 /usr/local/bin/brew --prefix libtorrent-rasterbar)
          test -f "$LT/lib/pkgconfig/libtorrent-rasterbar.pc"
          echo "BREW=arch -x86_64 /usr/local/bin/brew" >> "$GITHUB_ENV"
          echo "ARCHFLAG=-arch x86_64"                 >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      - name: Resolve Homebrew prefixes
        id: brew
        run: |
          set -euo pipefail
          BOOST=$($BREW --prefix boost)
          OPENSSL=$($BREW --prefix openssl@3 2>/dev/null || $BREW --prefix openssl)
          LT=$($BREW --prefix libtorrent-rasterbar)
          echo "boost=$BOOST"     >> "$GITHUB_OUTPUT"
          echo "openssl=$OPENSSL" >> "$GITHUB_OUTPUT"
          echo "lt=$LT"           >> "$GITHUB_OUTPUT"

      # Native arm64 only: running x86_64 cgo tests under Rosetta is slow, and
      # the build.yml linux-amd64 job already gates the test suite.
      - name: Run unit tests
        if: matrix.arch == 'arm64'
        working-directory: server
        env:
          CGO_ENABLED: '1'
          PKG_CONFIG_PATH: "${{ steps.brew.outputs.lt }}/lib/pkgconfig:${{ steps.brew.outputs.openssl }}/lib/pkgconfig"
          CGO_CXXFLAGS: "-I${{ steps.brew.outputs.boost }}/include -I${{ steps.brew.outputs.openssl }}/include"
          CGO_LDFLAGS: "-L${{ steps.brew.outputs.boost }}/lib -L${{ steps.brew.outputs.openssl }}/lib"
        run: go test -count=1 -timeout 180s ./lt/ ./torr/ ./torr/storage/torrstor/ ./dlna/

      - name: Build TorrServer-LT
        env:
          CGO_ENABLED: '1'
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
          # Homebrew's libtorrent .pc doesn't carry the Boost/OpenSSL include
          # paths; wire them through so cgo's clang finds boost/config.hpp.
          CGO_CXXFLAGS: "-I${{ steps.brew.outputs.boost }}/include -I${{ steps.brew.outputs.openssl }}/include"
          CGO_LDFLAGS: "-L${{ steps.brew.outputs.boost }}/lib -L${{ steps.brew.outputs.openssl }}/lib"
          PKG_CONFIG_PATH: "${{ steps.brew.outputs.lt }}/lib/pkgconfig:${{ steps.brew.outputs.openssl }}/lib/pkgconfig"
        run: |
          set -euo pipefail
          # ARCHFLAG is empty for arm64; for amd64 it makes every cgo compile and
          # the final link target x86_64 (GOARCH=amd64 handles the Go objects).
          export CC="clang $ARCHFLAG"
          export CXX="clang++ $ARCHFLAG"
          cd server
          mkdir -p ../out
          go build \
            -ldflags "-s -w -X server/version.Version=${{ inputs.version || 'MatriX.141.LT-1.0.0' }}" \
            -o "../out/${{ matrix.artifact }}" \
            ./cmd
          file "../out/${{ matrix.artifact }}"
          du -h "../out/${{ matrix.artifact }}"

      # The x86_64 binary runs on the arm64 host via Rosetta, so both probe.
      - name: Probe --version
        run: ./out/${{ matrix.artifact }} --version

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/${{ matrix.artifact }}
          if-no-files-found: error
