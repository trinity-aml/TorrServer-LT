name: build-macos

# macOS is built natively on Apple-Silicon runners (macos-latest):
#  - arm64 builds straight with the native clang;
#  - amd64 builds with `-arch x86_64` (cgo and b2 alike), so the artifact is a
#    real Intel binary. This avoids the deprecated/flaky macos-13 Intel runner.
#
# libtorrent is built from the PINNED source tag via build/darwin-native.sh —
# the same b2 engine every cross target uses — NOT taken from Homebrew: brew's
# libtorrent floats (its 2.1.0 bump broke the disk_io shim, which targets the
# pinned 2.0.x API) and would silently change what a release links against.

on:
  # No `push` trigger: the macOS build does NOT run on every push to master.
  # Build manually (workflow_dispatch) or via a release tag, which reuses this
  # workflow through ts_release.yml's workflow_call.
  pull_request:
    branches: [master]
  workflow_dispatch:
  # Reused by ts_release.yml on a tag; `version` stamps the binaries.
  workflow_call:
    inputs:
      version:
        type: string
        default: ''

jobs:
  macos:
    name: macos/${{ matrix.arch }}
    runs-on: macos-latest          # Apple Silicon (arm64)
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            artifact: TorrServer-LT-darwin-arm64
          - arch: amd64
            artifact: TorrServer-LT-darwin-amd64
    steps:
      - uses: actions/checkout@v4

      # amd64 cgo/b2 objects build with `-arch x86_64`; the binary runs on the
      # arm64 host via Rosetta 2 (present on the runners, assert anyway).
      - name: Ensure Rosetta 2
        if: matrix.arch == 'amd64'
        run: /usr/bin/pgrep -q oahd || sudo softwareupdate --install-rosetta --agree-to-license || true

      # Same _src cache key as build.yml, so the Boost+libtorrent sources
      # fetched by the linux matrix are reused here (the cache is not
      # OS-partitioned — it is a plain tar of the source trees).
      - name: Cache Boost + libtorrent sources
        uses: actions/cache@v4
        with:
          path: _src
          key: src-boost1.85.0-lt2.0.13-v1

      # Per-arch install tree (lib + headers + .pc). With it present the b2
      # step short-circuits and only the Go binaries are relinked.
      - name: Cache libtorrent install tree
        uses: actions/cache@v4
        with:
          path: _deps/darwin-${{ matrix.arch }}
          key: deps-darwin-${{ matrix.arch }}-boost1.85.0-lt2.0.13-v1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      - name: Fetch sources
        run: bash build/_fetch_sources.sh

      # Builds pinned libtorrent via b2 (cached after the first run), then the
      # base binary AND the -gst variant (see build/_deps.sh go_build).
      - name: Build
        env:
          TS_VERSION: ${{ inputs.version }}
        run: bash build/darwin-native.sh ${{ matrix.arch }}

      # Native arm64 only: running x86_64 cgo tests under Rosetta is slow, and
      # the build.yml linux-amd64 job already gates the test suite.
      - name: Run unit tests
        if: matrix.arch == 'arm64'
        working-directory: server
        env:
          CGO_ENABLED: '1'
          PKG_CONFIG_PATH: ${{ github.workspace }}/_deps/darwin-arm64/lib/pkgconfig
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/_deps/darwin-arm64/lib/pkgconfig
          CGO_LDFLAGS: "-L${{ github.workspace }}/_deps/darwin-arm64/lib -framework SystemConfiguration -framework CoreFoundation"
        run: go test -count=1 -timeout 180s ./lt/ ./torr/ ./torr/storage/torrstor/ ./dlna/

      # The x86_64 binary runs on the arm64 host via Rosetta, so both probe.
      - name: Probe --version
        run: |
          _out/${{ matrix.artifact }} --version
          _out/${{ matrix.artifact }}-gst --version

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: _out/${{ matrix.artifact }}*
          if-no-files-found: error
