name: Build and Release

# On a tag, reuse the cross-compile (build.yml) and macOS (build-macos.yml)
# workflows to produce the 8 TorrServer-LT binaries with the tag stamped in,
# then publish them to a GitHub Release. Matches the names in release.json.

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  # linux amd64/arm64/armv7, windows-amd64, android arm64/armv7
  cross:
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.ref_name }}

  # darwin arm64 (native) + amd64 (x86_64 cross via Rosetta)
  macos:
    uses: ./.github/workflows/build-macos.yml
    with:
      version: ${{ github.ref_name }}

  release:
    needs: [cross, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist
          merge-multiple: true

      - name: List release assets
        run: ls -lhR ./dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
