name: Test Install Script

on:
  push:
    branches:
      - master
    paths:
      - "installTorrServerLinux.sh"
      - ".github/workflows/test-install-script.yml"
      - ".github/scripts/test-install-script.sh"
  pull_request:
    branches:
      - master
    paths:
      - "installTorrServerLinux.sh"
      - ".github/workflows/test-install-script.yml"
      - ".github/scripts/test-install-script.sh"
  workflow_dispatch:

# Every TorrServer-LT build links libtorrent dynamically and requires glibc >= 2.38,
# so only distros that ship glibc >= 2.38 can run it. The matrix below is limited to
# such distros; older ones would just hit the installer's glibc refusal, so there is
# nothing meaningful to test there.
env:
  MAX_RETRIES: "3"
  RETRY_DELAY: "60"

jobs:
  test-script-syntax:
    name: Test Script Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Test script syntax
        run: |
          chmod +x installTorrServerLinux.sh
          bash -n installTorrServerLinux.sh
          echo "✓ Script syntax is valid"

      - name: Test help command
        run: |
          ./installTorrServerLinux.sh --help > /dev/null
          ./installTorrServerLinux.sh help > /dev/null
          echo "✓ Help command works"

  test-install-script:
    name: Test on ${{ matrix.os }} (${{ matrix.test-user }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - debian-13
          - fedora-latest
        test-user: [root, default]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get Docker image for OS
        id: get-image
        run: |
          # Map OS to Docker image
          case "${{ matrix.os }}" in
            ubuntu-24.04) IMAGE="ubuntu:24.04" ;;
            debian-13) IMAGE="debian:13" ;;
            fedora-latest) IMAGE="fedora:latest" ;;
            *)
              echo "Warning: Unknown OS ${{ matrix.os }}, using ubuntu:24.04 as default"
              IMAGE="ubuntu:24.04"
              ;;
          esac
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "Using Docker image: $IMAGE for OS: ${{ matrix.os }}"

      - name: Run tests in container
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            --privileged \
            -e MATRIX_OS="${{ matrix.os }}" \
            -e TEST_USER="${{ matrix.test-user }}" \
            -e MAX_RETRIES="${{ env.MAX_RETRIES }}" \
            -e RETRY_DELAY="${{ env.RETRY_DELAY }}" \
            "${{ steps.get-image.outputs.image }}" \
            bash -c "
              set -e

              # Make test script executable
              chmod +x .github/scripts/test-install-script.sh

              # Run the test script
              .github/scripts/test-install-script.sh
            "
