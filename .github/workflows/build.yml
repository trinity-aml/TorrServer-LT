name: build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-amd64:
    name: linux/amd64 (PoC)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build TorrServer-LT (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.builder
          platforms: linux/amd64
          push: false
          load: true
          tags: torrserver-lt:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Probe --version
        run: |
          docker run --rm torrserver-lt:ci --version

      - name: Export binary as artifact
        run: |
          id=$(docker create torrserver-lt:ci)
          docker cp "$id":/usr/local/bin/TorrServer-LT ./TorrServer-LT-linux-amd64
          docker rm "$id"
          file ./TorrServer-LT-linux-amd64
          du -h ./TorrServer-LT-linux-amd64

      - uses: actions/upload-artifact@v4
        with:
          name: TorrServer-LT-linux-amd64
          path: TorrServer-LT-linux-amd64
          if-no-files-found: error
