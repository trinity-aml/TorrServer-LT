name: build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  linux:
    name: ${{ matrix.platform }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            artifact: TorrServer-LT-linux-amd64
          - platform: linux/arm64
            artifact: TorrServer-LT-linux-arm64
          - platform: linux/arm/v7
            artifact: TorrServer-LT-linux-armv7
    steps:
      - uses: actions/checkout@v4

      # QEMU is only used for the non-native platforms; on amd64 the
      # action is a no-op but the setup-buildx step expects it to be
      # already configured before it can target multi-arch.
      - name: Set up QEMU
        if: matrix.platform != 'linux/amd64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build TorrServer-LT (${{ matrix.platform }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.builder
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: torrserver-lt:ci
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max

      - name: Probe --version
        run: docker run --rm --platform ${{ matrix.platform }} torrserver-lt:ci --version

      - name: Export binary as artifact
        run: |
          id=$(docker create --platform ${{ matrix.platform }} torrserver-lt:ci)
          docker cp "$id":/usr/local/bin/TorrServer-LT ./${{ matrix.artifact }}
          docker rm "$id"
          file ./${{ matrix.artifact }}
          du -h ./${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
